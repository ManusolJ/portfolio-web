@if (siblings().length > 1) {
  <div class="bg-bg/90 sticky top-0 z-30 flex gap-1 py-2 backdrop-blur">
    @for (item of siblings(); track item.route) {
      <a
        class="text-muted hover:text-content aria-[current=page]:bg-accent/10 aria-[current=page]:text-accent focus-visible:outline-accent flex-1 rounded-lg px-3 py-1.5 text-center text-sm font-medium no-underline transition-colors aria-[current=page]:font-semibold focus-visible:outline-2 focus-visible:outline-offset-2"
        [routerLink]="item.route"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ item.category }}
      </a>
    }
  </div>
}
