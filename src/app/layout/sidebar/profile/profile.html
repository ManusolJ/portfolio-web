<div class="flex flex-col items-center">
  <img alt="photo of Manuel Soler Juan" src="images/profile-photo.jpg" class="size-44 rounded-lg" />
  <h2 class="mt-4 text-center text-xl font-bold">Manuel Soler Juan</h2>
  <h3 class="text-muted mt-0.5 text-center text-sm font-medium">{{ jobTitle }}</h3>
  <a
    download
    [href]="downloadLink"
    class="border-accent text-accent hover:bg-accent hover:text-bg focus-visible:outline-accent mt-6 inline-flex w-full border-2 items-center justify-center gap-2 rounded-lg px-4 py-2.5 font-semibold no-underline transition-colors focus-visible:outline-2 focus-visible:outline-offset-2"
  >
    <ng-icon [svg]="downloadIcon" size="18" class="shrink-0" />
    {{ downloadAction }}
  </a>
</div>
