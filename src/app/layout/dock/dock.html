<nav
  class="bg-surface border-line fixed inset-x-0 bottom-0 z-40 border-t pb-[env(safe-area-inset-bottom)]"
  [attr.aria-label]="navLabel"
>
  <ul class="flex justify-around">
    @for (tab of tabs; track tab.group) {
      <li class="flex-1">
        <a
          class="text-muted aria-current:text-accent focus-visible:outline-accent flex flex-col items-center gap-1 px-2 py-2.5 text-[11px] font-medium no-underline transition-colors focus-visible:outline-2 focus-visible:-outline-offset-2"
          [routerLink]="firstRouteOf(tab.group)"
          [attr.aria-current]="activeGroup() === tab.group ? true : null"
        >
          <ng-container
            [ngComponentOutlet]="tab.icon"
            [ngComponentOutletInputs]="{ size: 22, class: 'shrink-0' }"
          />
          <span>{{ tab.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
