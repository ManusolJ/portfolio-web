<app-title-card [icon]="icons.grid" [pretitle]="pretitle" [title]="title" />

<ul class="mt-10 grid gap-4 sm:grid-cols-2">
  @for (project of projects; track project.slug) {
    <li class="border-line flex flex-col rounded-lg border p-5">
      <h2 class="text-lg font-semibold leading-snug">{{ project.name }}</h2>
      <p class="text-muted mt-2 text-sm leading-relaxed">{{ project.summary }}</p>
      <ul class="mt-4 flex flex-wrap gap-2" [attr.aria-label]="tagsLabel">
        @for (tag of project.tags; track tag) {
          <li class="border-line text-muted rounded-full border px-2.5 py-0.5 text-xs font-medium">
            {{ tag }}
          </li>
        }
      </ul>
      <div class="mt-auto flex flex-wrap items-center gap-x-4 gap-y-2 pt-5 text-sm">
        @if (project.repo) {
          <a
            target="_blank"
            [href]="project.repo"
            rel="noopener noreferrer"
            class="text-muted hover:text-accent focus-visible:outline-accent inline-flex items-center gap-1.5 rounded no-underline transition-colors hover:underline focus-visible:outline-2 focus-visible:outline-offset-2"
          >
            <ng-icon [svg]="icons.github" size="16" class="shrink-0" />
            {{ repoLabel }}
          </a>
        }
        @if (project.demo) {
          <a
            target="_blank"
            [href]="project.demo"
            rel="noopener noreferrer"
            class="text-muted hover:text-accent focus-visible:outline-accent inline-flex items-center gap-1.5 rounded no-underline transition-colors hover:underline focus-visible:outline-2 focus-visible:outline-offset-2"
          >
            <ng-icon [svg]="icons.external" size="16" class="shrink-0" />
            {{ demoLabel }}
          </a>
        }
        <a
          class="text-accent focus-visible:outline-accent ml-auto inline-flex items-center gap-1.5 rounded font-semibold no-underline hover:underline focus-visible:outline-2 focus-visible:outline-offset-2"
          [routerLink]="['/projects', project.slug]"
        >
          {{ detailLabel }}
          <ng-icon [svg]="icons.arrow" size="16" class="shrink-0" />
        </a>
      </div>
    </li>
  }
</ul>
