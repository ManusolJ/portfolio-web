<app-title-card [icon]="icon" [pretitle]="pretitle" [title]="title" />

<ol class="mt-10 flex flex-col gap-8">
  @for (entry of entries; track $index) {
    <li class="grid gap-3 lg:grid-cols-[7rem_1fr] lg:gap-6">
      <p class="text-muted text-sm tabular-nums lg:pt-1">
        <time [attr.datetime]="entry.start">{{ entry.start }}</time>
        @if (!entry.end) {
          - {{ present }}
        } @else if (entry.end !== entry.start) {
          - <time [attr.datetime]="entry.end">{{ entry.end }}</time>
        }
      </p>
      <div class="flex gap-4">
        <span
          class="border-line flex h-12 w-28 shrink-0 items-center justify-center rounded-lg border bg-white p-1.5"
        >
          <img
            alt="school-logo"
            [src]="entry.logo"
            class="max-h-full max-w-full object-contain text-black"
          />
        </span>
        <div>
          <h2 class="text-lg font-semibold">{{ entry.title }}</h2>
          <a
            [href]="entry.url"
            target="_blank"
            rel="noopener noreferrer"
            class="text-content hover:text-accent focus-visible:outline-accent rounded text-sm no-underline transition-colors hover:underline focus-visible:outline-2 focus-visible:outline-offset-2"
          >
            {{ entry.organization }}
          </a>
          <p class="text-muted mt-2 max-w-prose text-sm leading-relaxed">{{ entry.summary }}</p>
        </div>
      </div>
    </li>
  }
</ol>
