<app-title-card [icon]="icon" [pretitle]="pretitle" [title]="title" />

<ol class="mt-10 flex flex-col gap-4">
  @for (entry of entries; track $index) {
    <li>
      <app-timeline-card [entry]="entry">
        <p class="text-muted mt-3 max-w-prose text-sm leading-relaxed">{{ entry.summary }}</p>
      </app-timeline-card>
    </li>
  }
</ol>
