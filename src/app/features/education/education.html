<app-title-card [icon]="icon" [pretitle]="pretitle" [title]="title" />

<ol class="mt-10 flex flex-col gap-4">
  @for (entry of entries; track $index) {
    <li class="border-line rounded-lg border p-4 lg:p-5">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:gap-4">
        <span
          class="border-line flex h-12 w-28 shrink-0 items-center justify-center rounded-lg border bg-white p-1.5"
        >
          <img alt="" [src]="entry.logo" class="max-h-full max-w-full object-contain" />
        </span>
        <div class="min-w-0 flex-1">
          <h2 class="text-lg font-semibold leading-snug">{{ entry.title }}</h2>
          <a
            target="_blank"
            [href]="entry.url"
            rel="noopener noreferrer"
            class="text-content hover:text-accent focus-visible:outline-accent rounded text-sm no-underline transition-colors hover:underline focus-visible:outline-2 focus-visible:outline-offset-2"
          >
            {{ entry.organization }}
          </a>
        </div>
        <p class="text-muted text-sm tabular-nums sm:pt-1">
          <time [attr.datetime]="entry.start">{{ entry.start }}</time>
          @if (!entry.end) {
            – {{ present }}
          } @else if (entry.end !== entry.start) {
            – <time [attr.datetime]="entry.end">{{ entry.end }}</time>
          }
        </p>
      </div>
      <p class="text-muted mt-3 max-w-prose text-sm leading-relaxed">{{ entry.summary }}</p>
    </li>
  }
</ol>
