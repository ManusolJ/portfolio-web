<div
  #track
  role="region"
  tabindex="0"
  class="focus-visible:outline-accent flex snap-x snap-mandatory gap-4 overflow-x-auto pb-2 scrollbar-none focus-visible:outline-2 focus-visible:outline-offset-2 motion-safe:scroll-smooth"
  [attr.aria-label]="label()"
  (scroll)="update()"
>
  <ng-content />
</div>
<div class="mt-2 flex justify-end gap-2">
  <button
    type="button"
    class="border-line text-muted hover:border-accent hover:text-accent focus-visible:outline-accent flex size-9 cursor-pointer items-center justify-center rounded-lg border bg-transparent transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 disabled:cursor-default disabled:opacity-40 disabled:hover:border-line disabled:hover:text-muted"
    [disabled]="atStart()"
    [attr.aria-label]="previousLabel"
    (click)="scroll(-1)"
  >
    <ng-icon [svg]="previousIcon" size="18" />
  </button>
  <button
    type="button"
    class="border-line text-muted hover:border-accent hover:text-accent focus-visible:outline-accent flex size-9 cursor-pointer items-center justify-center rounded-lg border bg-transparent transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 disabled:cursor-default disabled:opacity-40 disabled:hover:border-line disabled:hover:text-muted"
    [disabled]="atEnd()"
    [attr.aria-label]="nextLabel"
    (click)="scroll(1)"
  >
    <ng-icon [svg]="nextIcon" size="18" />
  </button>
</div>
