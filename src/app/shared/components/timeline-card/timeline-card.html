@let item = entry();

<div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:gap-4">
  <span
    class="border-line flex h-12 w-28 shrink-0 items-center justify-center rounded-lg border bg-white p-1.5"
  >
    <img alt="" [src]="item.logo" class="max-h-full max-w-full object-contain" />
  </span>
  <div class="min-w-0 flex-1">
    <h2 class="text-lg font-semibold leading-snug">{{ item.title }}</h2>
    <p class="text-sm">
      <a
        target="_blank"
        [href]="item.url"
        rel="noopener noreferrer"
        class="text-content hover:text-accent focus-visible:outline-accent rounded no-underline transition-colors hover:underline focus-visible:outline-2 focus-visible:outline-offset-2"
      >
        {{ item.organization }}
      </a>
      @if (item.location) {
        <span class="text-muted"> | {{ item.location }}</span>
      }
    </p>
  </div>
  <p class="text-muted text-sm tabular-nums sm:pt-1">
    <time [attr.datetime]="item.start">{{ item.start | month }}</time>
    @if (!item.end) {
      – {{ present }}
    } @else if (item.end !== item.start) {
      – <time [attr.datetime]="item.end">{{ item.end | month }}</time>
    }
  </p>
</div>
<ng-content />
