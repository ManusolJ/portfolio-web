@let current = selected();
@let currentIcon = current.icon;

<button
  #trigger
  type="button"
  class="border-line text-content hover:bg-line hover:border-accent focus-visible:outline-accent flex cursor-pointer items-center gap-2 rounded-lg border bg-transparent px-3 py-2.5 text-sm transition-colors focus-visible:outline-2 focus-visible:outline-offset-2"
  [attr.aria-label]="label()"
  [attr.popovertarget]="menuId"
>
  @if (currentIcon.kind === 'image') {
    <img class="size-4 shrink-0" [src]="currentIcon.src" alt="" />
  } @else {
    <ng-container
      [ngComponentOutlet]="currentIcon.component"
      [ngComponentOutletInputs]="{ size: 16, class: 'shrink-0' }"
    />
  }
  <span class="whitespace-nowrap font-semibold">{{ current.label }}</span>
</button>

<div
  #menu
  class="border-line bg-surface fixed inset-auto m-0 min-w-32 rounded-xl border p-1 shadow-xl"
  popover="auto"
  [attr.id]="menuId"
  role="menu"
  (toggle)="reposition()"
>
  @for (option of options(); track option.value) {
    @let icon = option.icon;
    @if (option.href) {
      <a
        class="text-content hover:bg-line flex w-full items-center gap-2 rounded-md px-2.5 py-1.5 no-underline text-sm"
        role="menuitem"
        [href]="option.href"
      >
        @if (icon.kind === 'image') {
          <img class="size-4 shrink-0" [src]="icon.src" [alt]="option.value" />
        } @else {
          <ng-container
            [ngComponentOutlet]="icon.component"
            [ngComponentOutletInputs]="{ size: 16, class: 'shrink-0' }"
          />
        }
        <span>{{ option.label }}</span>
      </a>
    } @else {
      <button
        type="button"
        class="text-content hover:bg-line aria-checked:text-accent flex w-full cursor-pointer text-sm items-center gap-2 rounded-md px-2.5 py-1.5 aria-checked:font-semibold"
        role="menuitemradio"
        [attr.popovertarget]="menuId"
        popovertargetaction="hide"
        [attr.aria-checked]="option.value === value()"
        (click)="select(option.value)"
      >
        @if (icon.kind === 'image') {
          <img class="size-4 shrink-0" [src]="icon.src" alt="" />
        } @else {
          <ng-container
            [ngComponentOutlet]="icon.component"
            [ngComponentOutletInputs]="{ size: 16, class: 'shrink-0' }"
          />
        }
        <span>{{ option.label }}</span>
      </button>
    }
  }
</div>
