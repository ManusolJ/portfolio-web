<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 · Manuel Soler Juan</title>
    <link rel="icon" href="/es/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfa;
        --surface: #ffffff;
        --content: #16181d;
        --muted: #5b616e;
        --accent: #2f6f4f;
        --line: rgb(0 0 0 / 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1014;
          --surface: #1d2330;
          --content: #f3f4f6;
          --muted: #9aa1ad;
          --accent: #6ee7a8;
          --line: rgb(255 255 255 / 0.07);
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        font-family: 'Open Sans', ui-sans-serif, system-ui, sans-serif;
        color: var(--content);
        background: var(--bg);
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        border-radius: 0.75rem;
        background: var(--surface);
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
      }
      p.eyebrow {
        margin: 0;
        font-weight: 600;
        color: var(--accent);
      }
      h1 {
        margin: 0.25rem 0 0;
        font-size: 1.875rem;
        letter-spacing: -0.025em;
      }
      p.body {
        margin: 1rem 0 0;
        line-height: 1.625;
        color: var(--muted);
      }
      nav {
        display: flex;
        gap: 1rem;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--line);
      }
      a {
        font-weight: 600;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>Esta página no existe</h1>
      <p class="body">
        Puede que el enlace esté mal escrito o que la página se haya movido.
        <span lang="en"
          >This page doesn't exist — the link may be misspelt or the page may have moved.</span
        >
      </p>
      <nav>
        <a href="/es/">Volver al inicio</a>
        <a href="/en/" lang="en">Back to home</a>
      </nav>
    </main>
  </body>
</html>
